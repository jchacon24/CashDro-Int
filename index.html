<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Punto de Venta</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }
    
        header {
            background-color: #00a1a7;
            color: white;
            padding: 15px;
        }
    
        .container {
            display: flex;
            height: calc(100vh - 70px);
        }
    
        /* PRODUCTOS EN GRID */
        .products {
            flex: 3;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            background-color: #f5f5f5;
            overflow-y: auto;
        }
    
        .products > div {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: 0.2s ease;
        }
    
        .products > div:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    
        img {
            width: 120px;
            height: 120px;
            object-fit: cover;
        }
    
        /* CARRITO CON BORDE GRIS */
        .cart {
            flex: 1;
            padding: 20px;
            background-color: #fff;
            border-left: 2px solid #ddd;
            overflow-y: auto;
        }
    
        .cart .cart-item {
            margin-bottom: 10px;
        }
    
        .cart-total {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    
        .btn {
            background-color: #009688;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            border-radius: 6px;
            transition: 0.2s;
        }
    
        .btn:hover {
            background-color: #00796b;
        }
    
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }
    
        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
        }
    
        .close {
            float: right;
            font-size: 22px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Facturar - Producto</h1>
    </header>
    <div class="container">
        <div class="products">
            <div>
                <p><img src="./assets/images/american.jpg" alt=""></p>
                <p>Americano - $2000</p>
                <button class="btn" onclick="addToCart('Americano', 2000)">
                    Agregar producto
                </button>
            </div>
            <div>
                <p><img src="./assets/images/american.jpg" alt=""></p>
                <p>Americano Doble - $5000</p>
                <button class="btn btn-gray" onclick="addToCart('Americano Doble', 5000)">
                    Agregar producto
                </button>
            </div>
            <div>
                <p><img src="./assets/images/jugo_hit.jpg" alt=""></p>
                <p>Jugo Hit - $2800</p>
                <button class="btn btn-gray" onclick="addToCart('Jugo Hit', 2800)">
                    Agregar producto
                </button>
            </div>
            <div>
                <p><img src="./assets/images/fanta-naranja.webp" alt=""></p>
                <p>Fanta Naranja - $4000</p>
                <button class="btn btn-gray" onclick="addToCart('Fanta Naranja', 4000)">
                    Agregar producto
                </button>
            </div>
            <div>
                <p><img src="./assets/images/sprite.webp" alt=""></p>
                <p>Sprite - $3000</p>
                <button class="btn btn-gray" onclick="addToCart('Sprite', 3000)">
                    Agregar producto
                </button>
            </div>
            <div>
                <p><img src="./assets/images/coca.webp" alt=""></p>
                <p>Coca-Cola - $6000</p>
                <button class="btn btn-gray" onclick="addToCart('Sprite', 6000)">
                    Agregar producto
                </button>
            </div>
            <div>
                <p><img src="./assets/images/agua.png" alt=""></p>
                <p>Agua - $2500</p>
                <button class="btn btn-gray" onclick="addToCart('Agua', 2500)">
                    Agregar producto
                </button>
            </div>
            <!-- Agrega más productos aquí -->
        </div>
        <div class="cart">
            <h2>Ticket de venta</h2>
            <div id="cart-items"></div>
            <div class="cart-total">
                Total: $<span id="cart-total">0</span>
            </div>
            <button class="btn" id="paymentBtn">Método de pago</button>
            <div id="transaccion-result"></div>
        </div>
    </div>

    <!-- Modal para selección de método de pago -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Selecciona el método de pago</h2>
            <button class="btn" onclick="selectPaymentMethod('Tarjeta de Crédito')">Tarjeta de Crédito</button>
            <button class="btn" onclick="selectPaymentMethod('Tarjeta de Débito')">Tarjeta de Débito</button>
            <button class="btn" onclick="selectPaymentMethod('Efectivo')">Efectivo</button>
        </div>
    </div>

    <script>
        let cart = [];
        let total = 0 ;

        function addToCart(product, price) {
            if (cart[product]) {
                cart[product].quantity++;
                cart[product].totalPrice += price;
            } else {
                cart[product] = { quantity: 1, price, totalPrice: price };
            }
            total += price;
            updateCart();
        }

        function updateCart() {
            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = '';
            for (let product in cart) {
                const item = cart[product];
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerText = `${product} x ${item.quantity} - $${item.totalPrice}`;
                cartItems.appendChild(cartItem);
            }
            document.getElementById('cart-total').innerText = total.toFixed(0); // Mostrar total en entero
        }

        document.getElementById('paymentBtn').onclick = function() {
            document.getElementById('paymentModal').style.display = 'block';
        }

        document.getElementById('closeModal').onclick = function() {
            document.getElementById('paymentModal').style.display = 'none';
        }

        function selectPaymentMethod(method) {
    alert(`Método de pago seleccionado: ${method}`);
    document.getElementById('paymentModal').style.display = 'none';
    
    if (method === 'Efectivo') {
        let amount = total.toFixed(0);
        amount = amount * 100;
        const startOperationUrl = `https://192.168.2.118/Cashdro3WS/index3.php?operation=startOperation&name=admin&password=1&type=4&posid=terminal2&parameters={"amount":"${amount}"}&startnow=true&posuser=Jose`;
        
        // Realizar la primera llamada a la API para iniciar la transacción
        fetch(startOperationUrl, {
            method: 'GET',
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Error en la solicitud');
            }
            return response.json();
        })
        .then(data => {
            console.log('Respuesta de la primera llamada:', data); // Para depuración

            if (data.code !== 1) {
                throw new Error(`Error en la operación: ${data.response.errorMessage}`);
            }

            // Obtener operationId de la respuesta
            const operationId = data.response.operation.operationId;
            console.log('Operation ID:', operationId); // Para depuración
            
            // Realizar la segunda llamada a la API para ejecutar la transacción
            const acknowledgeOperationUrl = `https://192.168.2.118/Cashdro3WS/index3.php?operation=acknowledgeOperationId&name=admin&password=1&operationId=${operationId}`;
            
            return fetch(acknowledgeOperationUrl, {
                method: 'GET',
            });
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Error en la solicitud de ejecución de la transacción');
            }
            return response.json();
        })
        .then(finalData => {
            console.log('Respuesta de la segunda llamada:', finalData); // Para depuración
            if (finalData.code !== 1) {
                throw new Error(`Error en la operación: ${finalData.response.errorMessage}`);
            }
            document.getElementById('transaccion-result').innerText = `Resultado de la transacción: ${JSON.stringify(finalData)}`;
        })
        .catch(error => {
            document.getElementById('transaccion-result').innerText = `Error: ${error.message}`;
        });
    }
}
</script>
</body>
</html>
